<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GASコンボ</title>
<style>
  :root {
    --bg: #f0f2f5;
    --panel: #ffffff;
    --border: #b8bcc4;
    --border-soft: #d5d9e0;
    --text: #000000;
    --muted: #000000;
    --accent: #1d4ed8;
    --accent-hover: #1e40af;
    --accent-soft: #e8f0fe;
    --btn-bg: #ffffff;
    --btn-hover: #eef2f7;
    --btn-active: #dfe6f0;
    --ok: #15803d;
    --err: #b91c1c;
    --warn: #92400e;
    --font-ui: "Meiryo", "Yu Gothic UI", "BIZ UDPGothic", sans-serif;
    --font-mono: "BIZ UDGothic", "Meiryo", "Consolas", monospace;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: #000000;
    font-family: var(--font-ui);
    font-size: 13.5px;
    line-height: 1.35;
  }

  button, input, select, textarea {
    font-family: inherit;
    font-size: inherit;
    color: #000000;
  }

  ::placeholder {
    color: #333333;
    opacity: 1;
  }

  .app {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    padding: 6px;
    gap: 5px;
    overflow: hidden;
  }

  /* ---- 共通ボタン・入力 ---- */
  .btn {
    border: 1px solid var(--border);
    background: var(--btn-bg);
    color: #333333;
    border-radius: 3px;
    padding: 4px 6px;
    cursor: pointer;
    font-size: 11.2px;
    font-weight: 600;
    line-height: 1.25;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    user-select: none;
    transition: background-color 0.08s ease;
  }
  .btn:hover:not(:disabled) {
    background: var(--btn-hover);
  }
  .btn:active:not(:disabled) {
    background: var(--btn-active);
  }
  .btn:disabled {
    opacity: 0.55;
    cursor: default;
  }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent-hover);
    color: #ffffff;
    font-weight: 700;
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--accent-hover);
  }
  .btn-hero {
    width: 100%;
    padding: 6px 4px;
    font-size: 11.7px;
    font-weight: 700;
    background: var(--accent-soft);
    border-color: #7aa7e8;
    color: #333333;
    margin-bottom: 5px;
  }
  .btn-hero:hover:not(:disabled) {
    background: #dbeafe;
  }

  /* ---- 上部入力エリア ---- */
  .top-input {
    display: flex;
    gap: 5px;
    align-items: stretch;
    flex-shrink: 0;
  }
  .ask-textarea {
    flex: 1;
    min-width: 0;
    resize: none;
    height: 58px;
    padding: 4px 6px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--panel);
    color: #000000;
    font-size: 13.5px;
    line-height: 1.4;
    outline: none;
  }
  .ask-textarea:focus {
    border-color: var(--accent);
  }
  .top-btns {
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 66px;
    flex-shrink: 0;
  }
  .btn-run {
    flex: 1;
    font-size: 12.2px;
    padding: 4px 2px;
  }
  .top-sub-btns {
    display: flex;
    gap: 3px;
  }
  .btn-clear,
  .btn-ai {
    flex: 1;
    padding: 3px 2px;
    font-size: 10.7px;
  }

  /* ---- オプション行 ---- */
  .option-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: nowrap;
    gap: 6px;
    flex-shrink: 0;
    font-size: 12px;
    color: #000000;
  }
  .chk-label {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    flex-shrink: 0;
    color: #000000;
  }
  .chk-label input {
    margin: 0;
    cursor: pointer;
  }
  .status-label {
    flex: 1 1 0;
    min-width: 0;
    text-align: right;
    font-size: 12px;
    font-weight: 700;
    color: #000000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .status-label.busy {
    color: var(--accent);
  }

  /* ---- 対象 / シートバー ---- */
  .target-bar {
    display: flex;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
    background: #e9ecf1;
    border: 1px solid var(--border-soft);
    border-radius: 3px;
    padding: 3px 4px;
  }
  .target-name {
    max-width: 108px;
    font-size: 12.5px;
    font-weight: 700;
    color: #000000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 0;
  }
  .sheet-select {
    flex: 1;
    min-width: 0;
    height: 24px;
    border: 1px solid var(--border);
    border-radius: 2px;
    background: var(--panel);
    color: #000000;
    font-size: 12.5px;
    padding: 0 2px;
  }
  .target-bar .btn {
    padding: 3px 5px;
    font-size: 10.7px;
    flex-shrink: 0;
  }

  /* ---- タブバー ---- */
  .tabs-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .tab-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 2px;
    flex-shrink: 0;
    margin-bottom: -1px;
    z-index: 1;
  }
  .tab-btn {
    border: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    background: #e4e7ec;
    border-radius: 3px 3px 0 0;
    padding: 4px 2px; line-height: 1.2;
    font-size: 11.5px;
    font-weight: 600;
    color: #000000;
    cursor: pointer;
    text-align: center;
    white-space: nowrap;
  }
  .tab-btn:hover {
    background: #eef1f5;
  }
  .tab-btn.active {
    background: var(--panel);
    border-bottom-color: var(--panel);
    font-weight: 700;
    color: #000000;
  }

  .tab-body {
    flex: 1;
    min-height: 0;
    border: 1px solid var(--border);
    border-radius: 0 0 3px 3px;
    background: var(--panel);
    padding: 6px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .tab-pane {
    display: none;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .tab-pane.active {
    display: flex;
  }
  #pane-list {
    overflow: hidden;
  }

  /* ---- 自動タブ ---- */
  .quick-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    margin-bottom: 6px;
  }
  .quick-grid-4 {
    grid-template-columns: repeat(4, 1fr);
  }
  .quick-grid .btn {
    padding: 5px 2px;
    font-size: 11.2px;
    color: #333333;
  }
  .quick-grid-4 .btn {
    font-size: 10.6px;
  }
  .auto-status-box {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 2px;
    border-top: 1px solid var(--border-soft);
    padding-top: 5px;
  }
  .status-line {
    font-size: 12.5px;
    line-height: 1.35;
    color: #000000;
    word-break: break-word;
    overflow-wrap: anywhere;
    padding: 3px 5px;
    border-radius: 2px;
    background: #f8f9fb;
    border-left: 3px solid #cbd5e1;
  }
  .status-line.preview-hit {
    background: #eff6ff;
    border-left-color: var(--accent);
    color: #0b3b8c;
    font-weight: 600;
  }
  .status-line.preview-miss {
    background: #fffbeb;
    border-left-color: #d97706;
    color: var(--warn);
  }
  .status-line.info-line {
    color: #000000;
    white-space: pre-line;
  }

  /* ---- 会話・経過ログタブ ---- */
  .log-box {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    border: 1px solid var(--border-soft);
    background: #fafafa;
    border-radius: 2px;
    padding: 5px;
    color: #000000;
    font-family: var(--font-mono);
    font-size: 12.5px;
    line-height: 1.4;
  }
  .log-entry {
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: anywhere;
    padding-bottom: 5px;
    margin-bottom: 5px;
    border-bottom: 1px dashed #9ca3af;
  }
  .log-entry:last-child {
    margin-bottom: 0;
  }
  .log-entry.is-ok .log-head {
    color: var(--ok);
    font-weight: 700;
  }
  .log-entry.is-err .log-head {
    color: var(--err);
    font-weight: 700;
  }
  .log-entry.is-info .log-head {
    color: var(--accent);
    font-weight: 700;
  }
  .log-empty {
    color: #000000;
    font-size: 12.5px;
    padding: 6px;
    text-align: center;
  }
  .pane-footer {
    display: flex;
    justify-content: space-between;
    gap: 4px;
    margin-top: 5px;
    flex-shrink: 0;
  }

  /* ---- 履歴タブ ---- */
  .hist-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    border: 1px solid var(--border-soft);
    border-radius: 2px;
    background: #ffffff;
  }
  .hist-item {
    padding: 5px 6px;
    font-size: 13px;
    color: #000000;
    border-bottom: 1px solid #eef0f4;
    cursor: pointer;
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  .hist-item:hover {
    background: #f3f6fb;
  }
  .hist-item.selected {
    background: #dbeafe;
    font-weight: 600;
  }

  /* ---- 設定タブ ---- */
  .conf-group {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-bottom: 7px;
  }
  .conf-label {
    font-size: 12.5px;
    font-weight: 700;
    color: #000000;
  }
  .conf-control {
    width: 100%;
    height: 26px;
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 2px 5px;
    background: #ffffff;
    color: #000000;
    font-size: 13px;
  }
  .conf-actions {
    display: flex;
    gap: 4px;
    margin-top: 2px;
  }
  .conf-actions .btn {
    flex: 1;
    padding: 5px 4px;
  }
  .conf-note {
    font-size: 12px;
    color: #000000;
    word-break: break-word;
    background: #f8f9fb;
    border: 1px solid var(--border-soft);
    border-radius: 2px;
    padding: 4px 5px;
    white-space: pre-line;
  }

  /* ---- 下部固定バー ---- */
  .bottom-bar {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 4px;
    flex-shrink: 0;
  }
  .bottom-bar .btn {
    padding: 5px 2px;
    font-size: 10.7px;
    font-weight: 700;
    color: #333333;
  }

  /* ---- 一覧タブ・マイマクロ・手順保存 ---- */
  .quick-filter-bar { display: flex; gap: 2px; margin-bottom: 4px; flex-shrink: 0; }
  .quick-filter-btn { flex: 1; padding: 2px 2px; font-size: 10.5px; border: 1px solid var(--border); border-radius: 3px; background: #f4f5f7; color: #000000; cursor: pointer; text-align: center; white-space: nowrap; }
  .quick-filter-btn:hover { background: #e8eef6; }
  .quick-filter-btn.active { background: var(--accent); border-color: var(--accent-hover); color: #ffffff; font-weight: 700; }
  .quick-cat-bar { display: flex; flex-wrap: wrap; gap: 2px; margin-bottom: 4px; flex-shrink: 0; }
  .quick-cat-btn { padding: 1px 5px; font-size: 10px; border: 1px solid var(--border); border-radius: 10px; background: #ffffff; color: #334155; cursor: pointer; white-space: nowrap; line-height: 1.4; }
  .quick-cat-btn:hover { background: #e8eef6; border-color: #94a3b8; }
  .quick-cat-btn.active { background: #312e81; border-color: #312e81; color: #ffffff; font-weight: 700; }
  .quick-group-hdr { display: flex; align-items: center; justify-content: space-between; padding: 3px 6px; margin-top: 3px; font-size: 10.8px; font-weight: 700; color: #1e293b; background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 3px; cursor: pointer; user-select: none; }
  .quick-group-hdr:hover { background: #e0e7ff; }
  .quick-move { margin-left: auto; display: flex; gap: 2px; flex-shrink: 0; }
  .quick-move button { font-size: 10px; line-height: 1; padding: 1px 4px; border: 1px solid var(--border); border-radius: 2px; background: #fff; cursor: pointer; }
  .quick-move button:disabled { opacity: .35; cursor: default; }
  .quick-move button.is-pinned { color: #b45309; border-color: #f59e0b; background: #fffbeb; }
  .quick-pin-mark { flex-shrink: 0; font-size: 11px; color: #d97706; }
  .quick-item { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; user-select: none; -webkit-user-select: none; }
  .quick-label { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .quick-tag { flex-shrink: 0; font-size: 11px; padding: 0 4px; border-radius: 2px; background: #eef0f4; color: #000000; font-weight: 500; }
  .quick-tag.t-my { background: #dcfce7; color: #14532d; }
  .quick-tag.t-shelf { background: #e0e7ff; color: #312e81; }
  .quick-cat-pill { flex-shrink: 0; font-size: 9.5px; padding: 0 4px; border-radius: 8px; background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; margin-right: 3px; }
  .quick-cnt-pill { flex-shrink: 0; font-size: 9.5px; padding: 0 4px; border-radius: 8px; background: #fef3c7; color: #92400e; margin-left: 3px; }
  .quick-arg-mark { flex-shrink: 0; font-size: 10px; color: #0369a1; margin-left: 3px; font-weight: 700; }
  .quick-bolt { flex-shrink: 0; font-size: 11px; color: #d97706; }
  .quick-desc { font-size: 11px; color: #000000; font-weight: 500; }
  .quick-note { font-size: 11px; color: #000000; margin-top: 4px; min-height: 14px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hist-row { display: flex; align-items: flex-start; gap: 5px; }
  .hist-row input[type="checkbox"] { margin: 2px 0 0 0; flex-shrink: 0; cursor: pointer; }
  .hist-row-txt { flex: 1; min-width: 0; }
  .save-steps-bar { margin-top: 5px; padding: 5px; border: 1px solid #93c5fd; border-radius: 3px; background: #eff6ff; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
  .save-steps-info { font-size: 11px; color: #1e3a8a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .save-steps-row { display: flex; gap: 4px; align-items: center; }
  .save-steps-input { flex: 1; min-width: 0; height: 24px; padding: 2px 5px; border: 1px solid var(--border); border-radius: 2px; background: #ffffff; font-size: 12px; }
  .btn.btn-ai-primary { background: #312e81; border-color: #312e81; color: #ffffff; font-weight: 700; }
  .btn.btn-ai-primary:hover:not(:disabled) { background: #1e1b4b; border-color: #1e1b4b; color: #ffffff; }
  .quick-ai-box { display: flex; flex-direction: column; gap: 4px; padding: 5px; background: #ffffff; border: 1px solid #c7d2fe; border-radius: 4px; flex-shrink: 0; }
  .quick-ai-row { display: flex; gap: 4px; align-items: stretch; }
  .quick-ai-input { width: 100%; font-size: 12.5px; line-height: 1.4; padding: 4px 6px; border: 1px solid #94a3b8; border-radius: 4px; box-sizing: border-box; resize: none; font-family: inherit; }
  .quick-modal-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; flex-shrink: 0; }
  .quick-modal-tab { padding: 4px 6px; font-size: 11.5px; font-weight: 600; background: #e4e7ec; border: 1px solid var(--border); color: #0f172a; }
  .quick-modal-tab.active { background: #1d4ed8; border-color: #1e40af; color: #ffffff; font-weight: 700; }
  .quick-code-badge { display: none; margin-left: 4px; padding: 0 5px; border-radius: 8px; font-size: 9.5px; background: #16a34a; color: #ffffff; font-weight: 700; }
  .quick-chat-pane { flex: 1; min-height: 80px; display: none; flex-direction: column; gap: 5px; border: 1px solid #cbd5e1; border-radius: 4px; background: #ffffff; padding: 6px; overflow: hidden; }
  .quick-chat-log { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .quick-chat-msg { padding: 6px 8px; border-radius: 6px; font-size: 12px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }
  .quick-chat-msg.is-user { background: #eef2ff; border: 1px solid #c7d2fe; align-self: flex-end; max-width: 92%; }
  .quick-chat-msg.is-ai { background: #f8fafc; border: 1px solid #cbd5e1; align-self: flex-start; max-width: 96%; }
  .quick-chat-msg.is-code { background: #ecfdf5; border: 1px solid #86efac; align-self: flex-start; max-width: 96%; }
  .quick-chat-msg.is-err { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; align-self: flex-start; max-width: 96%; }
  .quick-chat-msg.is-pending { opacity: 0.78; font-style: italic; }
  .quick-chat-empty { font-size: 11.5px; color: #475569; padding: 8px; line-height: 1.5; }
  .quick-chat-chips { display: flex; flex-wrap: wrap; gap: 4px; flex-shrink: 0; }
  .quick-chat-chip { font-size: 10.5px; padding: 2px 7px; border-radius: 10px; border: 1px solid #c7d2fe; background: #eef2ff; color: #1e1b4b; cursor: pointer; }
  .quick-chat-chip:hover { background: #dbeafe; border-color: #93c5fd; }
  .health-badge { flex-shrink: 0; border-radius: 10px; border: 1px solid #cbd5e1; padding: 1px 6px; font-size: 10px; font-weight: 700; cursor: pointer; line-height: 1.3; white-space: nowrap; }
  .health-badge.is-green { background: #dcfce7; border-color: #86efac; color: #166534; }
  .health-badge.is-yellow { background: #fef3c7; border-color: #fcd34d; color: #92400e; }
  .health-badge.is-gray { background: #f1f5f9; border-color: #cbd5e1; color: #475569; }
  .retry-api-btn { margin-top: 4px; padding: 2px 8px; font-size: 10.5px; border: 1px solid #f59e0b; background: #fffbeb; color: #92400e; border-radius: 3px; cursor: pointer; font-weight: 700; }
  .retry-api-btn:hover { background: #fef3c7; }
  .quick-tools-row { display: flex; gap: 3px; flex-shrink: 0; margin-top: 3px; }
  .quick-tools-row .btn { flex: 1; padding: 2px 4px; font-size: 10px; }
  .quick-tpl-bar { display: flex; flex-wrap: wrap; gap: 3px; padding: 4px; margin-bottom: 4px; border: 1px solid #c7d2fe; border-radius: 3px; background: #eef2ff; flex-shrink: 0; }
  .quick-dryrun-bar { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 4px 6px; border: 1px solid #86efac; border-radius: 4px; background: #ecfdf5; color: #14532d; font-size: 11px; flex-shrink: 0; }
  .chat-sub-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin-bottom: 5px; flex-shrink: 0; }
  .chat-sub-btn { padding: 3px 4px; font-size: 11px; border: 1px solid var(--border); border-radius: 3px; background: #f4f5f7; color: #000000; cursor: pointer; text-align: center; white-space: nowrap; font-weight: 600; }
  .chat-sub-btn:hover { background: #e8eef6; }
  .chat-sub-btn.active { background: var(--accent); border-color: var(--accent-hover); color: #ffffff; font-weight: 700; }
  .chat-sub-pane { display: none; flex: 1; min-height: 0; flex-direction: column; overflow: hidden; }
  .chat-sub-pane.active { display: flex; }
  .conf-chk-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 6px; font-size: 11.5px; background: #f8f9fb; border: 1px solid var(--border-soft); border-radius: 2px; padding: 5px 6px; }
  .confirm-ok-btn { margin-top: 4px; margin-right: 4px; padding: 3px 9px; font-size: 11px; border: 1px solid #dc2626; background: #fef2f2; color: #991b1b; border-radius: 3px; cursor: pointer; font-weight: 700; }
  .confirm-ok-btn:hover { background: #fee2e2; }
</style>
</head>
<body>
<div class="app">
  <!-- 上部入力欄 -->
  <div class="top-input">
    <textarea id="askInput" class="ask-textarea" rows="3" placeholder="指示を入力（例: タイトルの色を赤に / 売上合計）"></textarea>
    <div class="top-btns">
      <button id="btnRun" class="btn btn-primary btn-run" type="button">実 行</button>
      <div class="top-sub-btns">
        <button id="btnClear" class="btn btn-clear" type="button" title="入力欄をクリア">✖</button>
        <button id="btnCopyAi" class="btn btn-ai" type="button" title="対象URL・シート・選択範囲・入力文をAI用にコピー">AI</button>
      </div>
    </div>
  </div>

  <!-- オプション行 -->
  <div class="option-row">
    <button id="healthBadge" class="health-badge is-gray" type="button" title="AI接続状態（クリックで再確認）">● 確認中</button>

    btnQuickDryRun: document.getElementById("btnQuickDryRun"),
    btnQuickEditSave: document.getElementById("btnQuickEditSave"),
    btnQuickEditDelete: document.getElementById("btnQuickEditDelete")
  };

  function hasGasBridge() {
    return typeof google !== "undefined" && google.script && google.script.run;
  }

  function callGas(fnName, arg, onOk, onErr) {
    if (!hasGasBridge()) {
      if (onErr) onErr(new Error("google.script.run が利用できません（GAS サイドバー外でのプレビュー表示中）"));
      return;
    }
    var runner = google.script.run
      .withSuccessHandler(function(res) { if (onOk) onOk(res); })
      .withFailureHandler(function(err) { if (onErr) onErr(err); });
    if (typeof runner[fnName] !== "function") {
      if (onErr) onErr(new Error("サーバー関数が見つかりません: " + fnName));
      return;
    }
    if (arg === undefined) {
      runner[fnName]();
    } else {
      runner[fnName](arg);
    }
  }

  function formatOpsShort(ops) {
    if (Planner.formatOpsShort) {
      return Planner.formatOpsShort(ops || []);
    }
    return (ops || []).map(function(o) {
      var args = Object.keys(o || {}).filter(function(k) { return k !== "shelf"; }).map(function(k) {
        return k + "=" + JSON.stringify(o[k]);
      }).join(", ");
      return (o.shelf || "?") + "(" + args + ")";
    }).join(", ");
  }

  function formatTiming(wallMs, gasMs, isDirectApi) {
    var wallSec = Math.max(0, wallMs / 1000);
    if (isDirectApi) {
      return "合計 " + wallSec.toFixed(2) + "s（直接API " + wallSec.toFixed(2) + "s / GAS 0.00s）";
    }
    if (typeof gasMs === "number" && isFinite(gasMs) && gasMs >= 0) {
      var gasSec = Math.max(0, gasMs / 1000);
      var commSec = Math.max(0, wallSec - gasSec);
      return "合計 " + wallSec.toFixed(2) + "s（通信 " + commSec.toFixed(2) + "s / GAS " + gasSec.toFixed(2) + "s）";
    }
    return "合計 " + wallSec.toFixed(2) + "s";
  }

  function setStatus(text, isBusy) {
    els.statusLabel.textContent = text;
    if (isBusy) {
      els.statusLabel.classList.add("busy");
    } else {
      els.statusLabel.classList.remove("busy");
    }
  }

  function setBusy(busy, statusText) {
    state.busy = !!busy;
    els.btnRun.disabled = state.busy;
    if (state.busy) {
      setStatus(statusText || "実行中…", true);
    } else {
      setStatus("表示中: " + (TAB_NAMES[state.activeTab] || "自動"), false);
      if (state._pendingLookSheet && typeof onLook === "function") {
        var nextLook = state._pendingLookSheet;
        state._pendingLookSheet = "";
        onLook(nextLook, { silentSuccess: true, fast: true });
        return;
      }
      if (state._queuedRunAsk && typeof onRunAsk === "function") {
        var qAsk = state._queuedRunAsk;
        state._queuedRunAsk = "";
        els.askInput.value = qAsk;
        onRunAsk();
      }
    }
  }

  function setChatSubTab(subKey) {
    var k = (subKey === "hist" || subKey === "trace") ? subKey : "log";
    state._chatSub = k;
    var subBtns = document.querySelectorAll(".chat-sub-btn");
    for (var i = 0; i < subBtns.length; i++) {
      subBtns[i].classList.toggle("active", subBtns[i].getAttribute("data-csub") === k);
    }
    var subPanes = document.querySelectorAll(".chat-sub-pane");
    for (var j = 0; j < subPanes.length; j++) {
      subPanes[j].classList.toggle("active", subPanes[j].id === "chatSub-" + k);
    }
    if (!state.busy && state.activeTab === "chat") {
      setStatus("表示中: " + (k === "hist" ? "履歴" : (k === "trace" ? "経過" : "会話")), false);
    }
  }

  function switchTab(tabKey) {
    if (!TAB_NAMES[tabKey]) tabKey = "auto";
    var domTab = (tabKey === "hist" || tabKey === "trace") ? "chat" : tabKey;
    state.activeTab = domTab;
    var btns = document.querySelectorAll(".tab-btn");
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle("active", btns[i].getAttribute("data-tab") === domTab);
    }
    var panes = document.querySelectorAll(".tab-pane");
    for (var j = 0; j < panes.length; j++) {
      panes[j].classList.toggle("active", panes[j].id === "pane-" + domTab);
    }
    if (tabKey === "hist" || tabKey === "trace") {
      setChatSubTab(tabKey);
    } else if (domTab === "chat") {
      setChatSubTab(state._chatSub || "log");
    } else if (!state.busy) {
      setStatus("表示中: " + TAB_NAMES[domTab], false);
    }
  }

  function appendLog(container, kindClass, headText, bodyText) {
    var empty = container.querySelector(".log-empty");
    if (empty) empty.remove();

    var entry = document.createElement("div");
    entry.className = "log-entry " + (kindClass || "is-info");

    var head = document.createElement("div");
    head.className = "log-head";
    head.textContent = headText;
    entry.appendChild(head);

    if (bodyText) {
      var body = document.createElement("div");
      body.textContent = bodyText;
      entry.appendChild(body);
    }

    container.appendChild(entry);
    container.scrollTop = container.scrollHeight;
    return entry;
  }

  // 棚に当たらなかった頼みに近い候補を出し、［はい］で撃って言い方を覚える（次から同じ頼みは一発で当たる）
  function loadLearned() {
    if (!Planner.setLearned) return;
    callGas("comboGetLearned", undefined, function(res) {
      if (res && res.learned && typeof res.learned === "object") {
        Planner.setLearned(res.learned);
        updatePreview();
      }
    }, function() {});
  }

  function offerChoices(txt, choices) {
    var descLines = [];
    for (var i = 0; i < choices.length; i++) {
      descLines.push((i + 1) + ". " + choices[i].label + " — " + (choices[i].desc || formatOpsShort(choices[i].ops)));
    }
    var entry = appendLog(els.chatLog, "is-info", "どこまで整えますか？: " + txt, descLines.join("\n"));
    var bar = document.createElement("div");
    bar.style.display = "flex";
    bar.style.flexWrap = "wrap";
    bar.style.gap = "6px";
    bar.style.marginTop = "6px";
    for (var j = 0; j < choices.length; j++) {
      (function(ch, idx) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "btn";
        b.textContent = (idx + 1) + ". " + ch.label;
        b.onclick = function() {
          bar.remove();
          onRunOps(ch.ops, txt + "（" + ch.label + "）");
        };
        bar.appendChild(b);
      })(choices[j], j);
    }
    entry.appendChild(bar);
    switchTab("chat");
  }

  function offerSuggest(txt, ops, onNo) {
    var entry = appendLog(els.chatLog, "is-info", "棚に当たりませんでした: " + txt,
      "近い候補: " + formatOpsShort(ops) + "\nこれを撃ちますか？（［はい］で撃って、この言い方を覚えます）");
    var bar = document.createElement("div");
    var yes = document.createElement("button");
    yes.type = "button";
    yes.className = "btn";
    yes.textContent = "はい（撃って覚える）";
    var no = document.createElement("button");
    no.type = "button";
    no.className = "btn";
    no.textContent = onNo ? "いいえ（AI に頼む）" : "いいえ";
    yes.onclick = function() {
      bar.remove();
      if (Planner.learn) Planner.learn(txt, ops);
      callGas("comboLearn", { ask: txt, ops: ops, key: Planner.learnKey ? Planner.learnKey(txt) : "" }, function() {}, function() {});
      onRunOps(ops, txt);
    };
    no.onclick = function() { bar.remove(); if (onNo) onNo(); };
    bar.appendChild(yes);
    bar.appendChild(no);
    entry.appendChild(bar);
    switchTab("chat");
  }

  function clearLogBox(container, placeholder) {
    container.innerHTML = "";
    var empty = document.createElement("div");
    empty.className = "log-empty";
    empty.textContent = placeholder || "";
    container.appendChild(empty);
  }

  function formatError(err) {
    if (!err) return "不明なエラー";
    if (typeof err === "string") return err;
    if (err.message) return err.message;
    try { return JSON.stringify(err); } catch (_e) { return String(err); }
  }

  function updateAutoPanelMode() {
    var isDoc = state.target && state.target.kind === "doc";
    els.autoSheetPanel.style.display = isDoc ? "none" : "block";
    els.autoDocPanel.style.display = isDoc ? "block" : "none";
  }

  function syncSheetSelects() {
    var isDoc = state.target && state.target.kind === "doc";
    var selects = [els.sheetSelect, els.settingsSheetSelect];
    for (var s = 0; s < selects.length; s++) {
      var sel = selects[s];
      sel.innerHTML = "";
      if (isDoc) {
        var optDoc = document.createElement("option");
        optDoc.value = "";
        optDoc.textContent = "（文書）";
        sel.appendChild(optDoc);
        sel.disabled = true;
      } else {
        sel.disabled = false;
        var list = state.sheets && state.sheets.length ? state.sheets : (state.curSheet ? [state.curSheet] : []);
        for (var i = 0; i < list.length; i++) {
          var opt = document.createElement("option");
          opt.value = list[i];
          opt.textContent = list[i];
          if (list[i] === state.curSheet) opt.selected = true;
          sel.appendChild(opt);
        }
      }
    }
  }

  function getSelectedSheet() {
    var isDoc = state.target && state.target.kind === "doc";
    if (isDoc) return "";
    var v = (els.sheetSelect && typeof els.sheetSelect.value === "string") ? els.sheetSelect.value : "";
    if (v && (!state.sheets || !state.sheets.length || state.sheets.indexOf(v) >= 0)) {
      return v;
    }
    return state.curSheet || "";
  }

  function syncCurSheetFromUi() {
    var sh = getSelectedSheet();
    if (sh) {
      state.curSheet = sh;
      if (els.sheetSelect && els.sheetSelect.value === sh) state._userSelectedSheet = sh;
    }
    return sh;
  }

  function applyExtSheet(extSheet) {
    var s = String(extSheet || "").trim();
    if (!s || (state.target && state.target.kind === "doc")) return false;
    state.hasExtSheet = true;
    var prev = state.lastServerSheet || "";
    var uiSel = (els.sheetSelect && typeof els.sheetSelect.value === "string") ? els.sheetSelect.value : "";
    var picked = state._userSelectedSheet || ((uiSel && uiSel !== state.curSheet) ? uiSel : "");
    var switched = !!(prev && s !== prev);
    state.lastServerSheet = s;
    if (switched) {
      state._userSelectedSheet = "";
      state.curSheet = s;
      syncSheetSelects();
      updatePreview();
      return true;
    }
    if (!picked) {
      state.curSheet = s;
      syncSheetSelects();
      updatePreview();
    }
    return false;
  }

  function updateSelectionLabel() {
    if (!els.chkSync.checked) {
      els.selLabel.textContent = "選択中: OFF（上部「連動」チェックで有効化）";
      return;
    }
    var isDoc = state.target && state.target.kind === "doc";
    if (isDoc) {
      if (state.heading) {
        els.selLabel.textContent = "選択中: 見出し「" + state.heading + "」";
      } else if (state.target.name) {
        els.selLabel.textContent = "選択中: " + state.target.name;
      } else {
        els.selLabel.textContent = "選択中: 待機中…";
      }
      return;
    }
    if (state.selection) {
      var shPart = state.curSheet ? (state.curSheet + " › ") : "";
      els.selLabel.textContent = "選択中: " + shPart + state.selection + "（「ここ」「選択範囲」や場所省略で即適用）";
    } else {
      els.selLabel.textContent = "選択中: 待機中（シート上のセルを選択してください）";
    }
  }

  function updateInfoLabel() {
    var tgt = state.target || {};
    var name = tgt.name || tgt.id || "対象未設定";
    els.targetNameLabel.textContent = name;
    els.targetNameLabel.title = name + (tgt.url ? "\n" + tgt.url : "");

    var msg = "";
    if (tgt.kind === "doc") {
      msg = "[文書] " + name + "\n（Google ドキュメントを選択中）";
    } else {
      var sh = state.curSheet || tgt.sheet || "";
      var tb = state.table;
      if (tb) {
        var cols = (tb.columns || []).map(function(c) {
          return (c.col || "") + ":" + (c.name || "");
        }).join("・");
        msg = "[表] " + name + (sh ? " › " + sh : "") +
          "\n見出し" + (tb.header_row || 1) + "行 (" + (tb.first_col || "?") + "〜" + (tb.last_col || "?") +
          "・" + (tb.data != null ? tb.data : "?") + "行)" +
          (cols ? " / 列: " + cols : "");
      } else {
        msg = "[表] " + name + (sh ? " › " + sh : "") + "（表情報なし）";
      }
    }
    els.infoLabel.textContent = msg;
    els.settingsInfoLabel.textContent = msg;
  }

  function getActiveScope() {
    if (!els.chkSync.checked) return null;
    if (state.scope && Object.keys(state.scope).length > 0) return state.scope;
    if (state.selection && Planner.parseSelectionScope) {
      return Planner.parseSelectionScope(state.selection);
    }
    return null;
  }

  function updatePreview() {
    var txt = (els.askInput.value || "").trim();
    els.previewLabel.classList.remove("preview-hit", "preview-miss");
    if (!txt) {
      els.previewLabel.textContent = "自動判定: 待機中";
      return null;
    }
    var kind = (state.target && state.target.kind) || "sheet";
    var ls = getActiveScope();
    var p = Planner.plan(txt, kind, state.table, state.sheets, syncCurSheetFromUi(), ls);
    if (p && p.fire) {
      var shortOps = formatOpsShort(p.ops);
      els.previewLabel.textContent = "棚ヒット: " + shortOps;
      els.previewLabel.classList.add("preview-hit");
    } else {
      var reason = "";
      if (p && p.reasons && p.reasons.length) {
        reason = p.reasons.join("／");
      } else if (p && p.missing && p.missing.length) {
        reason = "不足: " + p.missing.join("、");
      } else {
        reason = "棚に該当なし";
      }
      var suffix = els.chkAiAuto.checked ? "（実行時はAIが解釈して実行）" : "";
      els.previewLabel.textContent = "未確定: " + reason + suffix;
      els.previewLabel.classList.add("preview-miss");
    }
    return p;
  }

  function applyServerState(res, forceRefreshSnap, requestedSheet) {
    if (!res || typeof res !== "object") return;
    var prevTargetId = (state.target && state.target.id) || "";
    var nextTargetId = (res.target && typeof res.target === "object" && res.target.id) ? res.target.id : prevTargetId;
    if (prevTargetId && nextTargetId && nextTargetId !== prevTargetId) {
      state._userSelectedSheet = "";
      state.lastServerSheet = "";
      state.hasExtSheet = false;
    }
    var uiSel = (els.sheetSelect && typeof els.sheetSelect.value === "string") ? els.sheetSelect.value : "";
    var picked = state._userSelectedSheet || ((uiSel && uiSel !== state.curSheet) ? uiSel : "");
    var serverSheet = (typeof res.sheet === "string" && res.sheet) ? res.sheet : ((res.target && typeof res.target === "object" && res.target.sheet) ? res.target.sheet : "");
    var prevServerSheet = state.lastServerSheet || "";
    var isExplicitReq = !!(requestedSheet && serverSheet && requestedSheet === serverSheet);
    var trustServerSheet = !state.hasExtSheet;
    var serverSwitched = !!(trustServerSheet && !isExplicitReq && prevServerSheet && serverSheet && serverSheet !== prevServerSheet);
    if (serverSwitched) {
      state._userSelectedSheet = "";
      picked = "";
    }
    if (trustServerSheet && !isExplicitReq && serverSheet) {
      state.lastServerSheet = serverSheet;
    }
    if (res.target && typeof res.target === "object") {
      state.target = {
        id: res.target.id || state.target.id || "",
        name: res.target.name || state.target.name || "",
        kind: res.target.kind || state.target.kind || "sheet",
        url: res.target.url || state.target.url || "",
        sheet: res.target.sheet || ""
      };
      if (res.target.sheet && !picked && (trustServerSheet || !state.curSheet)) state.curSheet = res.target.sheet;
    }
    if (Array.isArray(res.sheets)) {
      state.sheets = res.sheets;
    }
    if (picked && (!state.sheets.length || state.sheets.indexOf(picked) >= 0)) {
      state.curSheet = picked;
    } else {
      if (picked && state.sheets.length && state.sheets.indexOf(picked) < 0) {
        state._userSelectedSheet = "";
        picked = "";
      }
      if (typeof res.sheet === "string" && res.sheet && (trustServerSheet || !state.curSheet)) {
        state.curSheet = res.sheet;
      }
      if (!state.curSheet && state.sheets.length) {
        state.curSheet = state.sheets[0];
      }
    }
    if ("table" in res && res.table !== undefined && (!picked || !serverSheet || serverSheet === picked)) {
      state.table = res.table;
    }
    if (typeof res.selection === "string") {
      state.selection = res.selection.toUpperCase();
      if (res.scope && typeof res.scope === "object") {
        state.scope = res.scope;
      } else if (state.selection && Planner.parseSelectionScope) {
        state.scope = Planner.parseSelectionScope(state.selection);
      } else {
        state.scope = {};
      }
    } else if (res.scope && typeof res.scope === "object") {
      state.scope = res.scope;
    }
    if (typeof res.heading === "string") {
      state.heading = res.heading;
    }
    if (res.config) {
      applyConfig(res.config);
    }
    if (res.learned && typeof res.learned === "object") {
      state.learned = res.learned;
      if (typeof Planner !== "undefined" && typeof Planner.setLearned === "function") {
        Planner.setLearned(res.learned);
      }
    }
    if (typeof res.oauthToken === "string" && res.oauthToken) {
      state.oauthToken = res.oauthToken;
    }
    if (Array.isArray(res.sheetInfos)) {
      for (var si = 0; si < res.sheetInfos.length; si++) {
        var sInfo = res.sheetInfos[si];
        if (sInfo && sInfo.name) {
          if (typeof sInfo.sheetId === "number") state.sheetIdMap[sInfo.name] = sInfo.sheetId;
          state.sheetDimsMap[sInfo.name] = { rows: Number(sInfo.rows || 0), cols: Number(sInfo.cols || 0) };
        }
      }
    }
    if (state.curSheet && typeof res.sheetId === "number") {
      state.sheetIdMap[state.curSheet] = res.sheetId;
    }

    updateAutoPanelMode();
    syncSheetSelects();
    updateSelectionLabel();
    updateInfoLabel();
    updatePreview();
    if (picked && serverSheet && serverSheet !== picked && !state.busy && typeof onLook === "function") {
      onLook(picked);
      return;
    }
    if (state.curSheet && state.oauthToken && state.target.id) {
      var curSnap = state.sheetSnapshot[state.curSheet];
      var needDim = getSnapshotDims(state.curSheet);
      if (forceRefreshSnap || !curSnap || (curSnap.maxRows && curSnap.maxRows < needDim.maxRows) || (curSnap.maxCols && curSnap.maxCols < needDim.maxCols)) {
        prefetchSheetSnapshot(state.curSheet);
      }
    }
  }

  function applyConfig(raw) {
    var cfg = (raw && raw.config) ? raw.config : raw;
    if (!cfg || typeof cfg !== "object") return;
    if (cfg.aiMode) state.config.aiMode = cfg.aiMode;
    if (cfg.aiModel) state.config.aiModel = cfg.aiModel;
    if ("bridgeToken" in cfg) state.config.bridgeToken = String(cfg.bridgeToken || "");
    var bkp = ("backupDefault" in cfg) ? cfg.backupDefault : cfg.backup;
    if (typeof bkp === "boolean") {
      state.config.backupDefault = bkp;
      els.chkBackup.checked = bkp;
    }
    if ("hasApiKey" in cfg) state.config.hasApiKey = !!cfg.hasApiKey;
    if ("apiKey" in cfg && cfg.apiKey) state.config.hasApiKey = true;
    if ("hasGeminiKey" in cfg) state.config.hasGeminiKey = !!cfg.hasGeminiKey;
    if ("hasClaudeKey" in cfg) state.config.hasClaudeKey = !!cfg.hasClaudeKey;

    if (els.cfgAiMode.querySelector('option[value="' + state.config.aiMode + '"]')) {
      els.cfgAiMode.value = state.config.aiMode;
    }
    if (els.cfgAiModel.querySelector('option[value="' + state.config.aiModel + '"]')) {
      els.cfgAiModel.value = state.config.aiModel;
    }
    updateApiKeyPlaceholder();
    if (typeof refreshHealthBadge === "function") refreshHealthBadge();
  }

  // 連携方式に合うモデルだけを出す（Gemini の鍵 → Gemini のモデル・それ以外 → Claude のモデル）
  // 方式を替えても、その系統で前に選んだモデルに戻す（無ければ Claude は Sonnet・Gemini は Hydrogen）
  function modelFamilyKey_(isGemini) { return "gasCombo.lastModel." + (isGemini ? "gemini" : "claude"); }
  function rememberModel_() {
    var v = els.cfgAiModel.value;
    try { localStorage.setItem(modelFamilyKey_(v.indexOf("gemini_") === 0), v); } catch (e) {}
  }
  function syncModelOptions() {
    var isGemini = els.cfgAiMode.value === "api_gemini";
    var opts = els.cfgAiModel.options, okVals = {}, curOk = false;
    for (var i = 0; i < opts.length; i++) {
      var ok = (opts[i].value.indexOf("gemini_") === 0) === isGemini;
      opts[i].hidden = !ok;
      opts[i].disabled = !ok;
      if (ok) okVals[opts[i].value] = true;
      if (ok && opts[i].value === els.cfgAiModel.value) curOk = true;
    }
    if (curOk) return;
    var last = "";
    try { last = localStorage.getItem(modelFamilyKey_(isGemini)) || ""; } catch (e) {}
    els.cfgAiModel.value = okVals[last] ? last : (isGemini ? "gemini_hydrogen" : "sonnet");
  }

  function updateApiKeyPlaceholder() {
    syncModelOptions();
    var mode = els.cfgAiMode.value;
    if (mode === "api_gemini" && (state.config.hasGeminiKey || state.config.hasApiKey)) {
      els.cfgApiKey.placeholder = "Geminiキー設定済み（変更時のみ入力）";
    } else if (mode === "api_claude" && (state.config.hasClaudeKey || state.config.hasApiKey)) {
      els.cfgApiKey.placeholder = "Claudeキー設定済み（変更時のみ入力）";
    } else if (mode === "postbox") {
      els.cfgApiKey.placeholder = "ローカル直結ではAPIキー不要";
    } else {
      els.cfgApiKey.placeholder = "APIキーを入力";
    }
  }

  function renderHistory() {
    els.histList.innerHTML = "";
    if (!state.history.length) {
      var empty = document.createElement("div");
      empty.className = "log-empty";
      empty.textContent = "実行した指示の履歴はまだありません。";
      els.histList.appendChild(empty);
      return;
    }
    for (var i = 0; i < state.history.length; i++) {
      (function(idx) {
        var item = document.createElement("div");
        item.className = "hist-item hist-row" + (state.selectedHistIdx === idx ? " selected" : "");
        var chk = document.createElement("input");
        chk.type = "checkbox";
        chk.checked = !!(state.checkedHist && state.checkedHist[idx]);
        chk.title = "チェックして「⚡手順化」でまとめて手順マクロにできます";

      .then(function(r) { if (!r.ok) throw new Error("Sheets API HTTP " + r.status); return r.json(); })
      .then(function(data) {

  function checkNewErrorsAfterDirect(sheetName, ops, done) {

      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(data) {

    var endRow = state.table.total_row

  function buildDirectBatchUpdate(ops, sheetName) {
    if (!Array.isArray(ops) || !ops.length) return null;
    if (!state.oauthToken || !state.target.id || state.target.kind !== "sheet" || !sheetName) return null;
    if (els.chkBackup.checked) return null;
    if (typeof state.sheetIdMap[sheetName] !== "number") return null;

    var sheetId = state.sheetIdMap[sheetName];
    var snapCur = state.sheetSnapshot[sheetName] || null;
    var maxRow0 = (snapCur && snapCur.maxRows) ? (snapCur.maxRows - 1) : 29;
    var maxCol0 = (snapCur && snapCur.maxCols) ? (snapCur.maxCols - 1) : 25;

  function fetchDirectTableSnippet(sheetName, table, done) {
    var colLetterLocal = function(n) {
      var s = "";
      while (n > 0) {
        var m = (n - 1) % 26;
        s = String.fromCharCode(65 + m) + s;
        n = Math.floor((n - 1) / 26);
      }
      return s;
    };
    var fallbackGas = function() {
      callGas("comboReadSnippet", {
        targetId: (state.target && state.target.id) || "",
        sheet: sheetName || state.curSheet || "",
        table: table || state.table || null
      }, function(res) {
        if (res && res.ok) done(res);
        else done({ text: "", truncated: false, totalRows: 0, note: "" });
      }, function() {
        done({ text: "", truncated: false, totalRows: 0, note: "" });
      });
    };
    if (typeof fetch !== "function" || !state.oauthToken || !state.target || !state.target.id) {
      fallbackGas();
      return;
    }
    var sh = sheetName || state.curSheet || (state.target && state.target.sheet) || "";
    var shPrefix = sh ? ("'" + sh.replace(/'/g, "''") + "'!") : "";
    var maxRows = 100, headRows = 80, tailRows = 20, maxCols = 26;
    var rangeStr = shPrefix + "A1:Z2000";
    var url = "https://sheets.googleapis.com/v4/spreadsheets/" + encodeURIComponent(state.target.id)
      + "?ranges=" + encodeURIComponent(rangeStr)
      + "&fields=" + encodeURIComponent("sheets(properties(gridProperties(rowCount)),data(rowData(values(formattedValue,userEnteredValue(formulaValue)))))");
    fetch(url, {
      method: "GET",
      headers: { "Authorization": "Bearer " + state.oauthToken }
    }).then(function(res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }).then(function(json) {
      var shObj = (json && json.sheets && json.sheets[0]) || {};
      var rd = (((shObj.data || [])[0] || {}).rowData) || [];
      var lastR = 0;
      for (var i = rd.length - 1; i >= 0; i--) {
        var vs = (rd[i] && rd[i].values) || [];
        var hasAny = false;
        for (var j = 0; j < vs.length; j++) {
          if (vs[j] && ((vs[j].formattedValue !== undefined && vs[j].formattedValue !== "") || (vs[j].userEnteredValue && vs[j].userEnteredValue.formulaValue))) {
            hasAny = true;
            break;
          }
        }
        if (hasAny) { lastR = i + 1; break; }
      }
      if (!lastR) {
        done({ text: "(シートは空です)", truncated: false, totalRows: 0, note: "" });
        return;
      }
      var gridRows = ((shObj.properties && shObj.properties.gridProperties && shObj.properties.gridProperties.rowCount) || lastR);
      var totalRows = (lastR >= 2000 && gridRows > 2000) ? gridRows : lastR;
      var truncated = totalRows > maxRows;
      var fmtRow = function(idx) {
        var vs = (rd[idx] && rd[idx].values) || [];
        var parts = [];
        var limC = Math.min(vs.length, maxCols);
        for (var c = 0; c < limC; c++) {
          var cell = vs[c] || {};
          var fv = cell.formattedValue !== undefined && cell.formattedValue !== null ? String(cell.formattedValue) : "";
          var fm = (cell.userEnteredValue && cell.userEnteredValue.formulaValue) ? String(cell.userEnteredValue.formulaValue) : "";
          if (!fv && !fm) continue;
          parts.push(colLetterLocal(c + 1) + "=" + fv + (fm ? " {" + fm + "}" : ""));
        }
        return "R" + (idx + 1) + ": " + (parts.length ? parts.join(" | ") : "(空行)");
      };
      var lines = [];
      if (!truncated) {
        for (var r = 0; r < lastR; r++) lines.push(fmtRow(r));
      } else {
        for (var rh = 0; rh < Math.min(headRows, lastR); rh++) lines.push(fmtRow(rh));
        lines.push("...（中略: 全 " + totalRows + " 行のうち先頭 " + headRows + " 行＋末尾 " + tailRows + " 行を抜粋）...");
        for (var rt = Math.max(headRows, lastR - tailRows); rt < lastR; rt++) lines.push(fmtRow(rt));
      }
      var note = truncated ? ("※全 " + totalRows + " 行のうち抜粋（先頭" + headRows + "行＋末尾" + tailRows + "行）で読みました") : "";
      done({ text: lines.join("\n"), truncated: truncated, totalRows: totalRows, note: note });
    }).catch(function() {
      fallbackGas();
    });
  }

  function tryDirectSheetsApi(ops, label, isFromAsk, fallbackFn, extraOpts) {

    var switchChat = !(extraOpts && extraOpts.switchToChat === false);

      .then(function(res) {

          recordExecution(true, label, lines.join("\n"), wallMs, 0, switchChat, true);

    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (!it || typeof it !== "object") continue;
      handled++;
      if (it.reqId) delete state.pendingPostboxIds[it.reqId];
      var ok = it.ok !== false;
      var label = it.ask || it.label || "郵便受けAI実行";
      var body = it.text || it.error || "";
      var gasMs = (typeof it.gasMs === "number") ? it.gasMs : undefined;
      if (it.kind === "mymacro") {
        appendLog(
          els.chatLog,
          ok ? "is-ok" : "is-err",
          "[" + (ok ? "✓" : "✗") + " 郵便受け AIマイマクロ] " + label,
          body + (gasMs !== undefined ? "\n(GAS " + (gasMs / 1000).toFixed(2) + "s)" : "")
        );
        if (ok && it.previewOnly && it.action === "reply") {
          applyQuickAiReplyResult(it);
          if (els.quickNote) els.quickNote.textContent = "💬 AI からマイマクロの返答が届きました";
        } else if (ok && it.previewOnly && it.code) {
          applyQuickAiPreviewResult(it);
          if (els.quickNote) els.quickNote.textContent = body || "✨ コード案ができました。内容を確認して「決定して保存」を押してください";
        } else if (ok && it.saved) {
          var sNm = it.newName || it.name || "";
          if (it.mode === "edit" && it.prevCode && sNm) quickSavePrevCode(sNm, it.prevCode);
          if (it.myId) state.quick.myId = it.myId;
          if (it.myUrl) state.quick.myUrl = it.myUrl;
          if (it.myStamp) state.quick.myStamp = it.myStamp;
          quickClearCodeCache();
          quickRememberLocal();
          updateSettingsMyMacroUI();
          if (els.quickNote) els.quickNote.textContent = body || "✨ AI マイマクロを保存しました";
          loadQuickList(false);
        } else if (ok && !it.saved && it.code) {
          (function(item) {
            var fnNm = (item.mode === "edit" && item.targetName) ? "comboQuickSaveFn" : "comboQuickAddFn";
            var argObj = (fnNm === "comboQuickSaveFn")
              ? { name: item.targetName, code: item.code, myId: item.myId || state.quick.myId || "" }
              : { code: item.code };
            callGas(fnNm, argObj, function(sRes) {
              if (!sRes || sRes.ok === false) {
                if (els.quickNote) els.quickNote.textContent = "⚠ " + ((sRes && sRes.error) || "マイマクロの保存に失敗しました");
                return;
              }
              var savedN = (sRes && (sRes.newName || sRes.name || (sRes.names && sRes.names[0]))) || item.targetName || "";
              if (item.mode === "edit" && item.prevCode && savedN) quickSavePrevCode(savedN, item.prevCode);
              if (sRes.myId) state.quick.myId = sRes.myId;
              if (sRes.myUrl) state.quick.myUrl = sRes.myUrl;
              if (sRes.myStamp) state.quick.myStamp = sRes.myStamp;
              quickClearCodeCache();
              quickRememberLocal();
              updateSettingsMyMacroUI();
              if (els.quickNote) els.quickNote.textContent = "✨ " + ((sRes && sRes.text) || "AI マイマクロを自動保存しました");
              loadQuickList(false);
            }, function(sErr) {
              if (els.quickNote) els.quickNote.textContent = "⚠ 自動保存に失敗: " + formatError(sErr);
            });
          })(it);
        } else {
          var samePending = !!(it.reqId && quickEditState.pendingReqId && quickEditState.pendingReqId === it.reqId);
          var modalOpen = !!(els.quickEditModal && els.quickEditModal.style.display !== "none");
          if (samePending || modalOpen) {
            if (samePending) quickEditState.pendingReqId = "";
            dropPendingQuickChat();
            quickEditState.chatHistory.push({ role: "err", text: "⚠ " + (it.error || body || "マイマクロ作成に失敗しました") });
            renderQuickChat();
            if (els.btnQuickAiSubmit) els.btnQuickAiSubmit.disabled = false;
            if (els.quickEditCode) els.quickEditCode.disabled = false;
            syncQuickSaveBtnState();
            if (els.quickEditStatus) els.quickEditStatus.textContent = "⚠ " + (it.error || body || "マイマクロ作成に失敗しました");
          }
          if (els.quickNote) els.quickNote.textContent = "⚠ " + (it.error || body || "マイマクロ作成に失敗しました");
        }
        continue;
      }
      appendLog(
        els.chatLog,
        ok ? "is-ok" : "is-err",
        "[" + (ok ? "✓" : "✗") + " 郵便受け] " + label,
        body + (gasMs !== undefined ? "\n(GAS " + (gasMs / 1000).toFixed(2) + "s)" : "")
      );
      if (it.table !== undefined) state.table = it.table;
    }
    if (handled > 0) {
      updateInfoLabel();
      updatePreview();
      els.postboxStatusLabel.textContent = "郵便受け: 完了結果 " + handled + "件を受信しました";
    }
  }

  // ---- アクション実行 ----
  function runServerAction(opts) {
    if (state.busy) {
      appendLog(els.chatLog, "is-err", "⚠ 別の処理を実行中です", "完了までお待ちください。");
      return;
    }
    var switchChat = opts.switchToChat !== false;
    setBusy(true, opts.statusText || "実行中…");
    if (switchChat) switchTab("chat");

    var t0 = performance.now();
    callGas(
      opts.fnName,
      opts.payload,
      function(res) {
        var wallMs = performance.now() - t0;
        setBusy(false);

        if (!res || res.ok === false) {
          var errMsg = (res && (res.text || res.error)) || "実行に失敗しました";
          if (res && res.needs_ok && errMsg.indexOf("確認なし") === -1) {
            errMsg += "\n（下の「確認して実行」ボタン、または設定の確認なしONで実行できます）";
          }
          var errEntry = recordExecution(false, opts.label, errMsg, wallMs, res && res.gasMs, opts.onError ? switchChat : true);
          if (res && res.needs_ok && errEntry) {
            var okBtn = document.createElement("button");
            okBtn.type = "button";
            okBtn.className = "confirm-ok-btn";
            okBtn.textContent = "⚠ 確認して実行";
            okBtn.addEventListener("click", function() {
              okBtn.disabled = true;
              runServerAction(Object.assign({}, opts, {
                payload: Object.assign({}, opts.payload || {}, { ok: true })
              }));
            });
            errEntry.appendChild(okBtn);
          }
          if (opts.onError) opts.onError(errMsg);
          return;
        }

        if (opts.onSuccess) opts.onSuccess(res, wallMs);
        applyServerState(res, true, opts.payload && opts.payload.sheet);

        if (res.pendingPostbox) {
          if (res.reqId) {
            state.pendingPostboxIds[res.reqId] = { startedAt: Date.now(), label: opts.label || "", warned: false };
          }
          els.postboxStatusLabel.textContent = "郵便受け: 待機中 (ID: " + (res.reqId || "-") + ")";
          var pText = res.text || "郵便受けに依頼を置きました。PC側の watch が処理するまで待機します。";
          appendLog(els.chatLog, "is-info", "[郵便受け待機] " + opts.label, pText + "\n(" + formatTiming(wallMs, res.gasMs) + ")");
          appendLog(els.traceLog, "is-info", "[… " + opts.label + "] " + formatTiming(wallMs, res.gasMs), "");
          kickWatcher();
          schedulePoll(800);
          return;
        }

        if (!opts.silentSuccess) {
          recordExecution(true, opts.label, res.text || "完了", wallMs, res.gasMs, switchChat);
        }
      },
      function(err) {
        var wallMs = performance.now() - t0;
        setBusy(false);
        recordExecution(false, opts.label, formatError(err), wallMs, undefined, opts.onError ? switchChat : true);
        if (opts.onError) opts.onError(err);
      }
    );
  }

  function quickClientStamp() {

  function onInit(silent) {

        },

  function hasSelectionPronoun(txt) {
    return /(ここ|このセル|選択範囲|選択セル|この行|この列|この範囲|今のセル)/.test(txt || "");
  }

  function requestLiveSelection(done) {
    if (typeof window === "undefined" || !window.top || window.top === window) {
      done(null);
      return;
    }
    var settled = false;
    var finish = function(res) {
      if (settled) return;
      settled = true;
      window.removeEventListener("message", onMsg);
      clearTimeout(timer);
      done(res);
    };
    var onMsg = function(ev) {
      var d = ev && ev.data;
      if (!d || d.type !== "GAS_COMBO_GET_SEL_DONE") return;
      finish(d.ok && (d.range || d.sheet) ? { range: String(d.range || "").trim(), sheet: String(d.sheet || "").trim() } : null);
    };
    window.addEventListener("message", onMsg);
    var timer = setTimeout(function() { finish(null); }, 250);
    try { window.top.postMessage({ type: "GAS_COMBO_GET_SEL" }, "*"); } catch (e) { finish(null); }
  }

  // 合い言葉つきの頼みは、いちばん外の窓が Google（シート・操作窓）のときだけ、その相手にだけ送る
  function bridgeTopOrigin() {
    try {
      var ao = location.ancestorOrigins;
      var top = ao && ao.length ? String(ao[ao.length - 1]) : "";
      if (top === "https://docs.google.com" || top === "https://script.google.com" ||
          top === "chrome-extension://mbkcmenmaeaiemdppphmbokhbfckpjhm") return top;
    } catch (e) {}
    return "";
  }
  function postToBridge(msg) {
    var to = bridgeTopOrigin();
    if (!to) throw new Error("bridge top is not Google");
    msg.token = (state.config && state.config.bridgeToken) || "";
    window.top.postMessage(msg, to);
  }

  function canUseDirectLocalAi() {
    if (typeof window === "undefined" || !window.top || window.top === window) return false;
    var mode = (els.cfgAiMode && els.cfgAiMode.value) || (state.config && state.config.aiMode) || "postbox";
    return mode === "postbox";
  }

  function getCurrentAiModel() {
    return (els.cfgAiModel && els.cfgAiModel.value) || (state.config && state.config.aiModel) || "";
  }

  function requestDirectAi(payload, done, onProgress) {
    if (!canUseDirectLocalAi()) {
      done({ reachable: false });
      return;
    }
    var reqId = "dir_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
    var settled = false;
    var ackTimer = null;
    var resTimer = null;
    var finish = function(res) {
      if (settled) return;
      settled = true;
      window.removeEventListener("message", onMsg);
      clearTimeout(ackTimer);
      clearTimeout(resTimer);
      done(res);
    };
    var onMsg = function(ev) {
      var d = ev && ev.data;
      if (!d || d.reqId !== reqId) return;
      if (d.type === "GAS_COMBO_DIRECT_AI_ACK") {
        clearTimeout(ackTimer);
        clearTimeout(resTimer);
        resTimer = setTimeout(function() {
          finish({ reachable: true, ok: false, error: "AI の返事が 70 秒たっても届きませんでした。もう一度実行してください" });
        }, 70000);
        return;
      }
      if (d.type === "GAS_COMBO_DIRECT_AI_PROGRESS") {
        // 途中の知らせが来ている間は待ち続ける（時計を巻き直す）
        clearTimeout(resTimer);
        resTimer = setTimeout(function() {
          finish({ reachable: true, ok: false, error: "AI の返事が 70 秒たっても届きませんでした。もう一度実行してください" });
        }, 70000);
        if (typeof onProgress === "function") {
          try { onProgress(d.event || {}); } catch (_eP) {}
        }
        return;
      }
      // 古い拡張の中継は宛名を「done」で上書きして送ってくる＝それも答えとして受け取る
      if (d.type === "GAS_COMBO_DIRECT_AI_DONE" || (d.type === "done" && d.inExtension)) {
        finish(d);
      }
    };
    window.addEventListener("message", onMsg);
    ackTimer = setTimeout(function() { finish({ reachable: false }); }, 350);
    try {
      postToBridge({ type: "GAS_COMBO_DIRECT_AI", reqId: reqId, payload: payload });
    } catch (e) {
      finish({ reachable: false });
    }
  }

  function requestRecordedMacros(payload, done) {

  function onRunAsk() {
    var txt = (els.askInput.value || "").trim();
    if (!txt) return;
    if (state.busy) {
      state._queuedRunAsk = txt;
      els.askInput.value = "";
      setStatus("読込完了後に実行します: " + txt, true);
      return;
    }
    var runAskBody = function() {
      pushHistory(txt);

    var activeSheet = syncCurSheetFromUi();
    var liveSelPrompt = !!(els.chkSync.checked && hasSelectionPronoun(txt));
    var planRes = updatePreview();
    var fireOps = (!liveSelPrompt && planRes && planRes.fire && Array.isArray(planRes.ops) && planRes.ops.length) ? planRes.ops : null;
    var planChoices = (!fireOps && !liveSelPrompt && planRes && Array.isArray(planRes.choices) && planRes.choices.length) ? planRes.choices : null;
    var isReadOnly = !!(planRes && planRes.readOnly && !fireOps && !planChoices);
    var aiAuto = !!els.chkAiAuto.checked;

    els.askInput.value = "";
    updatePreview();

    if (planChoices) {
      offerChoices(txt, planChoices);
      return;
    }

    // 読むだけの質問: aiAuto=false なら中身を AI へ送らず要約のみ。aiAuto=true なら中身を添えて AI へ渡し ops は必ず捨てる
    if (isReadOnly) {
      if (!aiAuto) {
        switchTab("chat");
        var tbSum = state.table

          : ("シート「" + activeSheet + "」");
        appendLog(els.chatLog, "is-info", "📖 " + txt + "（読むだけ）", "シートは変更していません。\n" + tbSum + "\n（※「AI自動」をONにするとシートの中身を読んで質問に答えます）");
        return;

    }

    // 近い候補があれば、AI自動でも先に［はい］を出す（郵便受けの受け手がいなくても止まらない。［いいえ］なら AI へ回す）
    var suggestOps = (!fireOps && !isReadOnly && !liveSelPrompt && planRes && Array.isArray(planRes.suggest) && planRes.suggest.length) ? planRes.suggest : null;

    var statusText = (!fireOps && aiAuto) ? "AI解釈・実行中…" : "実行中…";
    var payload = {

    var reportAiSolved = function(askText, solvedOps, noteText, srcName) {
      if (!askText || !Array.isArray(solvedOps) || !solvedOps.length) return;
      if (!canUseDirectLocalAi()) return;
      try {
        requestDirectAi({
          kind: "ai_solved",
          ask: askText,

        }, function() {});
      } catch (_eLog) {}
    };
    var runViaGasAsk = function() {
      state.directUndoStack = [];
      runServerAction({
        fnName: "comboRunAsk",
        payload: payload,
        label: txt,
        statusText: statusText,
        switchToChat: true,
        onSuccess: function(res) {
          if (res && res.ok && res.source === "ai_api" && Array.isArray(res.aiOps) && res.aiOps.length) {
            reportAiSolved(txt, res.aiOps, res.aiNote || "", "combo_api");
          }
        }
      });
    };
    var appendApiRetryLog = function(head, errMsg) {
      var entry = appendLog(els.chatLog, "is-err", head, errMsg);
      if (state.config && (state.config.hasGeminiKey || state.config.hasClaudeKey || state.config.hasApiKey)) {
        var forceMode = state.config.hasGeminiKey ? "api_gemini" : (state.config.hasClaudeKey ? "api_claude" : "");
        if (!forceMode) return;
        var retryBtn = document.createElement("button");
        retryBtn.type = "button";
        retryBtn.className = "retry-api-btn";
        retryBtn.textContent = "🔑 API 鍵で再試行";
        retryBtn.addEventListener("click", function() {
          retryBtn.disabled = true;
          runServerAction({
            fnName: "comboRunAsk",
            payload: Object.assign({}, payload, { forceAiMode: forceMode }),

    };
    var runAiAskDirectOrGas = function() {
      if (fireOps || !aiAuto || !canUseDirectLocalAi()) {
        runViaGasAsk();
        return;
      }
      var sendDirectPayload = function(sn) {
        setBusy(true, isReadOnly ? "📖 シートを読んで確認中…" : "✨ AI に確認中…");
        var aiReq = {
          kind: isReadOnly ? "read" : "ops",
          readOnly: isReadOnly,
          stream: true,
          ask: txt,
          ssId: state.target.id || "",
          ssName: state.target.name || "",
          sheet: activeSheet,
          selection: els.chkSync.checked ? (state.selection || "") : "",
          table: state.table,
          sheets: state.sheets || [],
          aiModel: getCurrentAiModel()
        };
        if (sn && sn.text) {
          aiReq.tableSnippet = sn.text || "";
          aiReq.truncated = !!sn.truncated;
          aiReq.totalRows = sn.totalRows || 0;
        }
        if (!isReadOnly && planRes) {
          if (Array.isArray(planRes.ops) && planRes.ops.length) aiReq.partialOps = planRes.ops;
          if (Array.isArray(planRes.reasons) && planRes.reasons.length) aiReq.planReasons = planRes.reasons;
          if (Array.isArray(planRes.missing) && planRes.missing.length) aiReq.planMissing = planRes.missing;
          if (Array.isArray(planRes.cards) && planRes.cards.length) {
            aiReq.planCards = planRes.cards.map(function(c) { return typeof c === "string" ? c : (c && c.name); }).filter(Boolean);
          }
        }
        requestDirectAi(aiReq, function(r) {
          setBusy(false);
          if (r && r.inExtension && !r.reachable) {
            switchTab("chat");
            appendApiRetryLog("⚠ PC 側の AI につながりません: " + txt, "PC 側の AI 窓口（127.0.0.1:18766）につながりません。PC で受け手が動いているか確かめてください");

          if (isReadOnly) {
            switchTab("chat");
            var roMsg = String(d.message || d.text || d.note || "").trim() || "読むだけの質問のためシートは変更しませんでした。";
            if (sn && sn.truncated && sn.note && roMsg.indexOf("抜粋") < 0) {

            appendLog(els.chatLog, "is-info", roHead, roMsg);
            return;
          }
          if (d.ok && d.action === "ops" && Array.isArray(d.ops) && d.ops.length) {
            var safeOps = d.ops.map(function(o) {
              if (!o || typeof o !== "object") return o;
              var cp = Object.assign({}, o);
              delete cp.ok;
              return cp;
            });
            if (Planner && typeof Planner.auditAiOps === "function") {
              var uiAud = Planner.auditAiOps(safeOps, txt, state.table);
              if (!uiAud.ok) {
                switchTab("chat");
                appendLog(els.chatLog, "is-err", "⚠ AI の手順を守りで止めました: " + txt, uiAud.issues.join(" ／ "));
                return;
              }
              safeOps = uiAud.ops;
            }
            onRunOps(safeOps, txt, { switchToChat: true, fromAi: true, aiAsk: txt, aiNote: d.note || "" });
            return;
          }
          if (d.ok && d.action === "reply") {
            switchTab("chat");
            var head = "💬 " + txt + (typeof d.aiMs === "number" ? ("（直結 " + (d.aiMs / 1000).toFixed(1) + "秒）") : "");

            return;
          }
          switchTab("chat");
          appendApiRetryLog("⚠ AI エラー: " + txt, String(d.error || r.error || "AI 処理に失敗しました"));
        }, function(ev) {

      };
      // aiAuto=true で AI に渡すときだけ表の中身（最大100行×26列・値と式）を取得して添える

        sendDirectPayload(sn);
      });
    };
    if (suggestOps) {
      offerSuggest(txt, suggestOps, aiAuto ? runAiAskDirectOrGas : null);
      return;
    }
    // 「ここ」「この列」など選択範囲の頼みも、Chrome 拡張から最新選択を即取得できれば直結 API（0.3 秒）で撃つ
    if (liveSelPrompt && !els.chkBackup.checked) {

          state.scope = Planner.parseSelectionScope ? Planner.parseSelectionScope(state.selection) : {};
          updateSelectionLabel();
          var livePlan = Planner.plan ? Planner.plan(txt, {
            table: state.table,

            kind: "sheet",
            learned: state.learned
          }) : null;
          var liveOps = (livePlan && livePlan.fire && Array.isArray(livePlan.ops) && livePlan.ops.length) ? livePlan.ops : null;
          if (liveOps && tryDirectSheetsApi(liveOps, txt, true, runViaGasAsk)) {
            return;
          }
        }
        (!fireOps && aiAuto) ? runAiAskDirectOrGas() : runViaGasAsk();
      });
      return;
    }
    if (fireOps && !liveSelPrompt && !els.chkBackup.checked) {
      var handledDirect = tryDirectSheetsApi(fireOps, txt, true, runViaGasAsk);
      if (handledDirect) return;
    }

    (!fireOps && aiAuto) ? runAiAskDirectOrGas() : runViaGasAsk();
    };
    if ((!state.target || state.target.kind !== "doc") && typeof requestLiveSelection === "function") {

  function requestDirectPing(done) {
    if (typeof window === "undefined" || !window.top || window.top === window) {
      done({ reachable: false, inExtension: false });
      return;
    }
    var reqId = "png_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
    var settled = false;
    var ackTimer = null;
    var resTimer = null;
    var finish = function(res) {
      if (settled) return;
      settled = true;
      window.removeEventListener("message", onMsg);
      clearTimeout(ackTimer);
      clearTimeout(resTimer);
      done(res);
    };
    var onMsg = function(ev) {
      var d = ev && ev.data;
      if (!d || d.reqId !== reqId) return;
      if (d.type === "GAS_COMBO_PING_LOCAL_ACK") {
        clearTimeout(ackTimer);
        clearTimeout(resTimer);
        resTimer = setTimeout(function() {
          finish({ reachable: false, inExtension: true, error: "応答が時間切れになりました" });
        }, 12000);
        return;
      }
      if (d.type === "GAS_COMBO_PING_LOCAL_DONE") {
        finish(d);
      }
    };
    window.addEventListener("message", onMsg);
    ackTimer = setTimeout(function() { finish({ reachable: false, inExtension: false }); }, 400);
    try {
      postToBridge({ type: "GAS_COMBO_PING_LOCAL", reqId: reqId });
    } catch (e) {
      finish({ reachable: false, inExtension: false });
    }
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(function() {
        return fallbackCopy(text);
      });
    }
    return fallbackCopy(text);
  }

  function fallbackCopy(text) {
    return new Promise(function(resolve, reject) {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        if (ok) resolve();
        else reject(new Error("コピーに失敗しました"));
      } catch (e) {
        reject(e);
      }
    });
  }

  // ---- 郵便受け完了待ちポーリング（常時ポーリングは行わない） ----
  function schedulePoll(delayMs) {
    if (state.pollTimer) {
      clearTimeout(state.pollTimer);
      state.pollTimer = null;
    }
    var hasPending = Object.keys(state.pendingPostboxIds).length > 0;
    if (!hasPending || !hasGasBridge()) return;

    state.pollTimer = setTimeout(runPollTick, delayMs || 1200);
  }

  function runPollTick() {
    state.pollTimer = null;
    var hasPending = Object.keys(state.pendingPostboxIds).length > 0;
    if (!hasPending) return;
    var nowMs = Date.now();
    var pKeys = Object.keys(state.pendingPostboxIds);
    for (var pi = 0; pi < pKeys.length; pi++) {
      var pInfo = state.pendingPostboxIds[pKeys[pi]];
      if (pInfo && typeof pInfo === "object" && !pInfo.warned && (nowMs - (pInfo.startedAt || nowMs)) >= 15000) {
        pInfo.warned = true;
        els.postboxStatusLabel.textContent = "郵便受け: 応答待ち (15秒経過)";
        appendLog(
          els.chatLog,
          "is-err",
          "⏳ 郵便受けの返事がありません（15秒経過）: " + (pInfo.label || pKeys[pi]),
          "受け手（combo watch）が --postbox なしで動いているか、停止している可能性があります。\n対処: `py gas.py combo watch <script_id> --postbox` で受け手を起動し直すか、Chrome 拡張のサイドパネルから実行してください。"
        );
      }
    }
    if (document.hidden || state.busy || state.polling) {
      schedulePoll(1500);
      return;
    }
    state.polling = true;
    var pollReq = {
      targetId: state.target.id || "",
      sheet: state.curSheet || ""
    };
    if (pollReq.targetId) pollReq.postboxOnly = true;
    callGas(
      "comboPollSelection",
      pollReq,
      function(res) {
        state.polling = false;
        if (res && res.ok !== false) {
          var prevSheet = state.curSheet;
          var prevSel = state.selection;
          if (typeof res.sheet === "string" && res.sheet && res.sheet !== prevSheet) {
            state.curSheet = res.sheet;
            syncSheetSelects();
          }
          if (typeof res.selection === "string") {
            state.selection = res.selection.toUpperCase();
          }
          if (res.scope && typeof res.scope === "object") {
            state.scope = res.scope;
          } else if (state.selection && Planner.parseSelectionScope) {
            state.scope = Planner.parseSelectionScope(state.selection);
          } else {
            state.scope = {};
          }
          if (typeof res.heading === "string") {
            state.heading = res.heading;
          }
          if (res.postboxDone) {
            handlePostboxDone(res.postboxDone);
          }
          if (state.curSheet !== prevSheet || state.selection !== prevSel) {
            updateSelectionLabel();
            updatePreview();
          }
        }
        if (Object.keys(state.pendingPostboxIds).length > 0) {
          schedulePoll(1800);
        }
      },
      function() {
        state.polling = false;
        if (Object.keys(state.pendingPostboxIds).length > 0) {
          schedulePoll(3000);
        }
      }
    );
  }

  // ---- キーボード操作（Enter実行・Shift+Enter改行・上下履歴） ----
  function getCursorLineInfo(ta) {
    var val = ta.value || "";
    var pos = ta.selectionStart || 0;
    var before = val.slice(0, pos);
    var lineIdx = before.split("\n").length - 1;
    var totalLines = val.split("\n").length;
    return { lineIdx: lineIdx, totalLines: totalLines };
  }

  els.askInput.addEventListener("keydown", function(e) {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      if (state.activeTab === "list" && quickRunFromInput()) return;
      onRunAsk();
      return;
    }
    if (e.key === "ArrowUp") {
      var infoUp = getCursorLineInfo(els.askInput);
      if (infoUp.lineIdx === 0 && state.history.length > 0) {
        e.preventDefault();
        if (state.histIdx < 0 || state.histIdx > state.history.length) {
          state.histIdx = state.history.length;
        }
        state.histIdx = Math.max(0, state.histIdx - 1);
        els.askInput.value = state.history[state.histIdx] || "";
        updatePreview();
        if (state.activeTab === "list") { state.quick.sel = -1; renderQuickList(); }
      }
      return;
    }
    if (e.key === "ArrowDown") {
      var infoDown = getCursorLineInfo(els.askInput);
      if (infoDown.lineIdx === infoDown.totalLines - 1 && state.history.length > 0) {
        e.preventDefault();
        state.histIdx = Math.min(state.history.length, state.histIdx + 1);
        els.askInput.value = (state.histIdx >= state.history.length) ? "" : (state.history[state.histIdx] || "");
        updatePreview();
        if (state.activeTab === "list") { state.quick.sel = -1; renderQuickList(); }
      }
    }
  });

  function quickNorm(t) {
    var s = String(t || "");
    if (typeof s.normalize === "function") s = s.normalize("NFKC");
    s = s.replace(/[\u30a1-\u30f6]/g, function(ch) { return String.fromCharCode(ch.charCodeAt(0) - 0x60); });
    return s.toLowerCase().replace(/[\s　]+/g, "");
  }

  function quickGetSynRules() {
    if (_quickSynRules) return _quickSynRules;
    var raw = (typeof COMBO_CATALOG_DATA !== "undefined" && COMBO_CATALOG_DATA.synonyms) || [];
    var rules = [];
    for (var i = 0; i < raw.length; i++) {
      var pair = raw[i];
      if (!Array.isArray(pair) || pair.length < 2) continue;
      var a = quickNorm(pair[0]), b = quickNorm(pair[1]);
      if (a && b && a !== b) rules.push([a, b]);
    }
    rules.sort(function(x, y) { return y[0].length - x[0].length; });
    _quickSynRules = rules;
    return _quickSynRules;
  }

  function quickNormSyn(t) {
    var s = quickNorm(t);
    if (!s) return "";
    var rules = quickGetSynRules();
    for (var i = 0; i < rules.length; i++) {
      var a = rules[i][0];
      if (s.indexOf(a) >= 0) s = s.split(a).join(rules[i][1]);
    }
    return s;
  }

  function quickAttachNorm(it) {
    if (!it || it._nw) return it;
    var seen = {}, list = [];
    var rawList = [it.label, it.name].concat(it.words || [], it.cat ? [it.cat] : []);
    for (var i = 0; i < rawList.length; i++) {
      var r = rawList[i];
      if (!r) continue;
      var n = quickNorm(r);
      if (n && !seen[n]) { seen[n] = 1; list.push(n); }
      var ns = quickNormSyn(r);
      if (ns && !seen[ns]) { seen[ns] = 1; list.push(ns); }
    }
    it._nw = list;
    it._nd = it.desc ? quickNormSyn(it.desc) : "";
    it._nst = (it.steps && it.steps.length) ? quickNormSyn(it.steps.join(" ")) : "";
    return it;
  }

  function quickShelfItems() {
    var isDoc = !!(state.target && state.target.kind === "doc");
    if (isDoc && _quickShelfCacheDoc) return _quickShelfCacheDoc;
    if (!isDoc && _quickShelfCacheSheet) return _quickShelfCacheSheet;
    var shelves = (typeof COMBO_CATALOG_DATA !== "undefined" && COMBO_CATALOG_DATA.shelves) || [];
    var items = shelves.filter(function(sh) {

      var ex = (Array.isArray(sh.examples) && sh.examples.length && Array.isArray(sh.examples[0]) && sh.examples[0][0])

      return quickAttachNorm({ src: "shelf", name: sh.name, label: sh.title || sh.name, cat: sh.category || "", words: sh.words || [], desc: "", example: ex, needArgs: needArgs });
    });
    if (isDoc) _quickShelfCacheDoc = items;
    else _quickShelfCacheSheet = items;
    return items;
  }

  function quickCatList() {
    var counts = {}, list = quickShelfItems();
    for (var i = 0; i < list.length; i++) {
      var c = list[i].cat || "その他";
      counts[c] = (counts[c] || 0) + 1;
    }
    var order = (typeof COMBO_CATALOG_DATA !== "undefined" && COMBO_CATALOG_DATA.categories) || [];
    var out = [], seen = {};
    for (var j = 0; j < order.length; j++) {
      var oc = order[j];
      if (counts[oc]) { out.push({ name: oc, count: counts[oc] }); seen[oc] = 1; }
    }
    Object.keys(counts).forEach(function(k) { if (!seen[k]) out.push({ name: k, count: counts[k] }); });
    return out;
  }

  function quickOrdered(list, order) {
    var pos = {};
    (order || []).forEach(function(n, i) { pos[n] = i; });
    return list.map(function(it, i) { return { it: it, i: i }; }).sort(function(a, b) {
      var pa = pos.hasOwnProperty(a.it.name) ? pos[a.it.name] : -100000 + a.i;
      var pb = pos.hasOwnProperty(b.it.name) ? pos[b.it.name] : -100000 + b.i;
      return pa - pb;
    }).map(function(x) { return x.it; });
  }

  }

  function quickScoreToken(item, t, ts) {
    if (!t) return 1;
    quickAttachNorm(item);
    var best = 0, nw = item._nw || [];
    for (var i = 0; i < nw.length; i++) {
      var n = nw[i];
      if (n === t || (ts && n === ts)) best = Math.max(best, 100);
      else if (n.indexOf(t) >= 0 || (ts && n.indexOf(ts) >= 0)) best = Math.max(best, 60);
      else if (n.length >= 2 && (t.indexOf(n) >= 0 || (ts && ts.indexOf(n) >= 0))) best = Math.max(best, 40 + Math.min(n.length, 20));
    }
    if (!best && item._nd && (item._nd.indexOf(t) >= 0 || (ts && item._nd.indexOf(ts) >= 0))) best = 30;
    if (!best && item._nst && (item._nst.indexOf(t) >= 0 || (ts && item._nst.indexOf(ts) >= 0))) best = 25;
    return best;
  }

  function quickScore(item, txt) {
    if (!txt) return 1;
    var raw = String(txt || "").trim();
    var parts = raw.split(/[\s　]+/).filter(Boolean);
    if (!parts.length) return 1;
    if (parts.length === 1) {
      var t0 = quickNorm(parts[0]);
      return t0 ? quickScoreToken(item, t0, quickNormSyn(parts[0])) : 1;
    }
    var total = 0, cnt = 0;
    for (var i = 0; i < parts.length; i++) {
      var t = quickNorm(parts[i]);
      if (!t) continue;
      var sc = quickScoreToken(item, t, quickNormSyn(parts[i]));
      if (!sc) return 0;
      total += sc;
      cnt++;
    }
    return cnt ? (Math.round(total / cnt) + 10) : 1;
  }

  function quickFiltered() {
    var txt = (els.askInput.value || "").trim();
    var q = state.quick;
    var f = q.filter || "all";
    var usage = q.usage || {};
    var all = quickAllItems().filter(function(it) {
      if (f === "all") return true;
      if (f === "pin") return quickIsPinned(it);
      if (f === "recent") return !!(usage[quickUsageKey(it)] && usage[quickUsageKey(it)].t);
      if (f === "shelf") {
        if (it.src !== "shelf") return false;
        if (q.cat && q.cat !== "all" && (it.cat || "その他") !== q.cat) return false;
        return true;

      return it.src === f;
    });
    if (!txt) {

        return pinned.concat(rest);
      }
